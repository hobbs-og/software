name: Tokens

on:
  pull_request:
    paths:
      - 'tokens/**'
      - 'scripts/**'
      - 'checks/**'
      - 'figma-plugin/**'
      - '.github/workflows/tokens.yml'
  push:
    branches: [main]
    paths:
      - 'tokens/**'
      - 'scripts/**'
      - 'checks/**'
  workflow_dispatch:

concurrency:
  group: tokens-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build platforms and check contrast
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # On a pull request, check out the branch itself so generated files can be committed to it.
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build web, iOS and Android outputs
        run: node scripts/build.mjs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platforms
          if git diff --cached --quiet; then
            echo "Generated files already up to date."
          else
            git commit -m "Build: regenerate platform tokens"
            git push
          fi

      # Runs after the commit so a failing check still leaves the generated diff on the PR for review.
      - name: WCAG contrast check
        run: node scripts/check-contrast.mjs

  swift:
    name: Compile Swift package for iOS
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Build for iOS Simulator
        run: xcodebuild build -scheme SoftwareTokens -destination 'generic/platform=iOS Simulator' -quiet
