<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Software Tokens → GitHub</title>
<style>
  :root {
    color-scheme: light dark;
    font: 400 0.75rem/1.25rem Inter, system-ui, sans-serif;
  }
  body {
    margin: 0;
    padding: 1rem;
    background: var(--figma-color-bg);
    color: var(--figma-color-text);
  }
  h1 {
    margin: 0 0 0.25rem;
    font-size: 0.875rem;
    font-weight: 600;
  }
  p {
    margin: 0 0 1rem;
    color: var(--figma-color-text-secondary);
  }
  form {
    display: grid;
    gap: 0.75rem;
  }
  fieldset {
    display: grid;
    gap: 0.75rem;
    margin: 0;
    padding: 0;
    border: 0;
  }
  legend {
    margin-bottom: 0.5rem;
    font-weight: 600;
  }
  label {
    display: grid;
    gap: 0.25rem;
  }
  .check {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  input[type="text"],
  input[type="password"],
  textarea {
    padding: 0.5rem;
    border: 1px solid var(--figma-color-border);
    border-radius: 0.25rem;
    background: var(--figma-color-bg);
    color: var(--figma-color-text);
    font: inherit;
  }
  textarea {
    min-height: 4rem;
    resize: vertical;
  }
  :focus-visible {
    outline: 2px solid var(--figma-color-border-selected);
    outline-offset: 1px;
  }
  .hint {
    color: var(--figma-color-text-secondary);
  }
  button {
    min-height: 2.5rem;
    padding: 0 1rem;
    border: 0;
    border-radius: 0.25rem;
    background: var(--figma-color-bg-brand);
    color: var(--figma-color-text-onbrand);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    background: var(--figma-color-bg-disabled);
    color: var(--figma-color-text-disabled);
    cursor: not-allowed;
  }
  .link {
    background: none;
    color: var(--figma-color-text-brand);
    text-decoration: underline;
    padding: 0;
    min-height: auto;
    font-weight: 400;
  }
  output {
    display: block;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .status-error {
    color: var(--figma-color-text-danger);
  }
  .status-success {
    color: var(--figma-color-text-success);
  }
</style>
</head>
<body>
<main>
  <h1>Push tokens to GitHub</h1>
  <p>Exports every local variable in <strong id="file-name">this file</strong> and opens a pull request with the changes.</p>

  <form id="form">
    <fieldset>
      <legend>Repository</legend>
      <label>
        Owner / repository
        <input id="repo" type="text" name="repo" required autocomplete="off" spellcheck="false" value="hobbs-og/software" pattern="[\w.-]+/[\w.-]+">
      </label>
      <label>
        Base branch
        <input id="base" type="text" name="base" required autocomplete="off" spellcheck="false" value="main">
      </label>
      <label>
        GitHub token
        <input id="token" type="password" name="token" required autocomplete="off" spellcheck="false" aria-describedby="token-hint">
        <span id="token-hint" class="hint">Fine-grained token for this repository only, with Contents and Pull requests set to Read and write.</span>
      </label>
      <label class="check">
        <input id="remember" type="checkbox" name="remember">
        Remember token on this computer
      </label>
    </fieldset>

    <label>
      What changed (optional)
      <textarea id="notes" name="notes"></textarea>
    </label>

    <button id="submit" type="submit">Export and open pull request</button>
  </form>

  <output id="status" for="submit" aria-live="polite"></output>
  <button id="pr-link" class="link" type="button" hidden>Open pull request</button>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const form = $('form');
  const statusEl = $('status');
  const prLink = $('pr-link');
  let prUrl = null;
  let exportResolve = null;

  const send = (message) => parent.postMessage({ pluginMessage: message }, '*');

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = kind ? 'status-' + kind : '';
  }

  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'settings') {
      $('file-name').textContent = msg.fileName;
      const s = msg.settings;
      if (s.repo) $('repo').value = s.repo;
      if (s.base) $('base').value = s.base;
      if (s.token) {
        $('token').value = s.token;
        $('remember').checked = true;
      }
    } else if (msg.type === 'exported' && exportResolve) {
      exportResolve(msg.result);
      exportResolve = null;
    } else if (msg.type === 'error') {
      setStatus(msg.message, 'error');
      $('submit').disabled = false;
    }
  };

  async function github(token, method, path, body) {
    const res = await fetch('https://api.github.com' + path, {
      method,
      headers: {
        Accept: 'application/vnd.github+json',
        Authorization: 'Bearer ' + token,
        'X-GitHub-Api-Version': '2022-11-28',
        ...(body ? { 'Content-Type': 'application/json' } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = res.status === 204 ? null : await res.json().catch(() => null);
    if (!res.ok) {
      const reason = res.status === 401 ? 'The token was rejected. Check it has not expired.'
        : res.status === 404 ? 'Repository or branch not found, or the token cannot access it.'
        : (data && data.message) || res.statusText;
      throw new Error(`GitHub ${method} ${path} failed (${res.status}): ${reason}`);
    }
    return data;
  }

  function stamp() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const repo = $('repo').value.trim();
    const base = $('base').value.trim();
    const token = $('token').value.trim();
    const notes = $('notes').value.trim();

    send({ type: 'save-settings', settings: { repo, base, token: $('remember').checked ? token : '' } });
    $('submit').disabled = true;
    prLink.hidden = true;

    try {
      setStatus('Exporting variables…');
      const result = await new Promise((resolve) => {
        exportResolve = resolve;
        send({ type: 'export' });
      });
      const { files, summary } = result;

      if (summary.errors.length) {
        setStatus(`Fix these in Figma before pushing (${summary.errors.length}):\n\n• ` + summary.errors.join('\n• '), 'error');
        return;
      }

      setStatus(`Exported ${summary.tokenCount} tokens. Contacting GitHub…`);
      const r = `/repos/${repo}`;
      const ref = await github(token, 'GET', `${r}/git/ref/heads/${encodeURIComponent(base)}`);
      const baseCommit = await github(token, 'GET', `${r}/git/commits/${ref.object.sha}`);
      const baseTree = await github(token, 'GET', `${r}/git/trees/${baseCommit.tree.sha}?recursive=1`);

      // Token files that no longer exist in Figma get deleted, but only in the folder
      // this file owns (summary.dir), never another Figma file's tokens.
      const owned = (path) => path.startsWith(summary.dir) && path.endsWith('.json') && !path.slice(summary.dir.length).includes('/');
      const removed = baseTree.tree
        .filter((e) => e.type === 'blob' && owned(e.path) && !(e.path in files))
        .map((e) => ({ path: e.path, mode: '100644', type: 'blob', sha: null }));

      const entries = Object.entries(files).map(([path, content]) => ({ path, mode: '100644', type: 'blob', content }));
      const tree = await github(token, 'POST', `${r}/git/trees`, { base_tree: baseCommit.tree.sha, tree: entries.concat(removed) });

      if (tree.sha === baseCommit.tree.sha) {
        setStatus(`No changes. ${base} already matches Figma.`, 'success');
        return;
      }

      const title = `Tokens: sync from Figma (${stamp()})`;
      const commit = await github(token, 'POST', `${r}/git/commits`, { message: title, tree: tree.sha, parents: [ref.object.sha] });
      const branch = `tokens/figma-${stamp()}`;
      await github(token, 'POST', `${r}/git/refs`, { ref: `refs/heads/${branch}`, sha: commit.sha });

      const body = [
        `Exported from the Figma file **${summary.fileName}**.`,
        notes ? `\n## What changed\n\n${notes}` : '',
        `\n## Export\n\n- ${summary.tokenCount} tokens`,
        ...summary.collections.map((c) => `- ${c}`),
        removed.length ? `\nRemoved: ${removed.map((e) => '`' + e.path + '`').join(', ')}` : '',
        summary.warnings.length ? `\n## Warnings\n\n- ${summary.warnings.join('\n- ')}` : '',
        '\nThe build workflow regenerates the web, iOS and Android outputs on this branch and runs the contrast checks.',
      ].join('\n');

      const pr = await github(token, 'POST', `${r}/pulls`, { title, head: branch, base, body });
      prUrl = pr.html_url;
      setStatus(`Pull request #${pr.number} opened.` + (summary.warnings.length ? `\n\nWarnings:\n• ${summary.warnings.join('\n• ')}` : ''), 'success');
      prLink.hidden = false;
    } catch (err) {
      setStatus(String(err.message || err), 'error');
    } finally {
      $('submit').disabled = false;
    }
  });

  prLink.addEventListener('click', () => prUrl && send({ type: 'open-url', url: prUrl }));

  send({ type: 'init' });
</script>
</body>
</html>
